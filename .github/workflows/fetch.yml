name: 曲データを自動取得

on:
  schedule:
    # 毎朝6時15分（日本時間）。ニコニコの検索データは毎朝5時に更新される
    - cron: "15 21 * * *"
  workflow_dispatch:      # Actionsの画面から手動でも動かせる
    inputs:
      seed:
        description: "昔からの人気曲（原曲の土台）をまとめて取り込む"
        type: boolean
        default: false
      search:
        description: "YouTube検索も使う（1日の検索回数に上限があるので、ふだんは朝の自動更新だけで使う）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 曲データを取得
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NO_SEARCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.search && '1' || '' }}
        run: node scripts/fetch.mjs ${{ inputs.seed && '--seed' || '' }}
      - name: 保存済みの曲を今のルールで読み直す
        run: node scripts/reclassify.mjs
      - name: 曲ごと・作者ごと・タグごとのページを作る
        run: node scripts/pages.mjs
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ song/ p/ tag/ picks/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "曲データを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git push
          fi
