name: 曲データを自動取得

on:
  schedule:
    # ふだんは毎日0時（日本時間）に Claude の予約タスクから手動実行で起動する（GitHub の予約は混んでいると飛ばされることがあるため）。
    # 下の2つは予備：その日の更新がもう済んでいたら何もしない
    - cron: "30 15 * * *"   # 0時30分
    - cron: "15 20 * * *"   # 5時15分
  workflow_dispatch:      # Actionsの画面から手動でも動かせる
    inputs:
      seed:
        description: "昔からの人気曲（原曲の土台）をまとめて取り込む"
        type: boolean
        default: false
      search:
        description: "YouTube検索も使う（1日の検索回数に上限があるので、ふだんは朝の自動更新だけで使う）"
        type: boolean
        default: false
      vocadb_probe:
        description: "VocaDB の確認用：この動画ID（sm〇〇 か YouTube のID）の返事をログに出すだけ"
        type: string
        default: ""
      vocadb_limit:
        description: "VocaDB で調べる曲の数（1回の実行で）"
        type: string
        default: "400"

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - id: c
        name: 予約のときは、今日の更新がもう済んでいるか確かめる
        run: |
          today=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && git log -50 --format=%s | grep -qx "曲データを更新 $today"; then
            echo "今日（$today）の更新は済んでいるので何もしない"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
  fetch:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 曲データを取得
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NO_SEARCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.search && '1' || '' }}
        run: node scripts/fetch.mjs ${{ inputs.seed && '--seed' || '' }}
      - name: VocaDB で答え合わせ用の情報を集める
        continue-on-error: true
        env:
          VOCADB_LIMIT: ${{ inputs.vocadb_limit || '400' }}
        run: node scripts/vocadb.mjs ${{ inputs.vocadb_probe && format('--probe {0}', inputs.vocadb_probe) || '' }}
      - name: 保存済みの曲を今のルールで読み直す
        run: node scripts/reclassify.mjs
      - name: 曲ごと・作者ごと・タグごとのページを作る
        run: node scripts/pages.mjs
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ song/ p/ tag/ s/ picks/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "曲データを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            # 実行中に別の変更が入っていたら（手での修正など）、取りこんでから送り直す
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            done
          fi
