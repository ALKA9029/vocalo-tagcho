name: 曲データを自動取得

on:
  schedule:
    # 毎朝6時15分（日本時間）。ニコニコの検索データは毎朝5時に更新される
    - cron: "15 21 * * *"
  workflow_dispatch:      # Actionsの画面から手動でも動かせる
    inputs:
      seed:
        description: "昔からの人気曲（原曲の土台）をまとめて取り込む"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 曲データを取得
        run: node scripts/fetch.mjs ${{ inputs.seed && '--seed' || '' }}
      - name: 保存済みの曲を今のルールで読み直す
        run: node scripts/reclassify.mjs
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "曲データを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git push
          fi
