<style>
/* Layout: narrow single column "track list" — header, filter bar, then song rows like a playlist; tags sit under each row like stickers; a row expands to show related tracks */
:root{

  --accent:#d6336c; --accent-soft:#fbe3ec; --accent-ink:#ffffff; --hot:#7b3fe4; --hot-soft:#ece4fc;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#ff6b9a; --accent-soft:#3a1f2b; --accent-ink:#1a0d13; --hot:#b294ff; --hot-soft:#2b2342;

:root[data-theme="dark"]{
  --bg:#14151f; --surface:#1d1f2c; --ink:#ecedf5; --muted:#9a9db3; --line:#2e3142;
  --accent:#ff6b9a; --accent-soft:#3a1f2b; --accent-ink:#1a0d13; --hot:#b294ff; --hot-soft:#2b2342;
  --cover:#4fd1c0; --cover-soft:#173430; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}

input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}

.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;background:none;border:0;color:var(--ink);padding:6px 12px;cursor:pointer}

.shuffle{font:inherit;font-size:13px;flex:none;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}

.fold:hover{border-color:var(--accent)}
.fold .n{display:inline-block;min-width:18px;margin-left:2px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-family:var(--f-mono);text-align:center}

<div class="wrap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
// みんなのタグ投票を保存するデータベース（Supabase）の接続先。
// ここに入れるのは公開用の鍵なので、サイトに載せても大丈夫（書き込みはデータベース側のルールで制限している）
const SUPABASE_URL = "https://qfepllrtalfvyhsezjwc.supabase.co";
const SUPABASE_KEY = "sb_publishable_DIFM6mVEbJaB0OYSkY74Hw_1oF_6eaU";

const TAGS = ["爽やか","エモい","切ない","かっこいい","かわいい","踊れる","疾走感","中毒性","泣ける","落ち着く","ピアノが好き","ギターが好き"];
const FIXED_AT = 3;
const PAGE = 40;

let ITEMS = [], ITEM = {};
const state = { serverCounts:{}, serverMine:{}, mine:{}, open:null, rel:null, play:null, shuffle:null, q:"", genre:"", kind:"", sort:"views", period:"", person:null, filter:new Set(), shown:PAGE, canWrite:true, uid:null, db:null };
const $ = s => document.querySelector(s);

// 表示する票数 = みんなの票数（最後に読み込んだ時点）から自分の分を引いて、今の自分の票を足したもの
function counts(){
  const c = {};
  for (const [sid, tags] of Object.entries(state.serverCounts)) for (const [t, n] of Object.entries(tags)) {
    const v = n - (state.serverMine[sid]?.includes(t) ? 1 : 0);
    if (v > 0) { c[sid] ??= {}; c[sid][t] = v; }
  }
  for (const [sid, tags] of Object.entries(state.mine)) for (const t of tags) {
    if (!TAGS.includes(t)) continue;
    c[sid] ??= {}; c[sid][t] = (c[sid][t] || 0) + 1;
  }
  return c;
}

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (v == null) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}

// 作者キーが「投稿者ID」由来か（名前がない曲は同じ投稿者どうしでまとめる）
const realKey = a => a && !/:$/.test(a);
const fmtDate = d => d ? d.slice(0,10).replace(/-/g,"/") : "";
const fmtViews = n => n == null ? "" : n >= 1e4 ? (n/1e4).toFixed(n >= 1e5 ? 0 : 1) + "万回" : n.toLocaleString("ja-JP") + "回";
const original = i => i.of ? ITEM[i.of] : null;
// 曲ページ・作者ページ（scripts/pages.mjs が書き出す）へのURL
let CREATOR_PAGE = {};
const ALIAS = {};
const songPage = i => i && i.kind === "本家" ? "song/" + i.id.replace(/^nico:/, "nico-").replace(/^yt:/, "yt-") + "/" : null;
const pageSlug = id => id.replace(/^nico:/, "nico-").replace(/^yt:/, "yt-");
// 曲名を押したときの行き先：本家は曲ページ、歌ってみたは原曲のページのその行。ページがなければ null
function detailUrl(i){
  if (i.kind === "本家") return songPage(i);
  const o = original(i);
  return o && o.kind === "本家" ? songPage(o) + "#c-" + pageSlug(i.id) : null;
}
const creatorPage = a => a && CREATOR_PAGE[a] ? CREATOR_PAGE[a].replace(/^\//, "") : null;

function creditText(i){
  if (i.kind === "歌ってみた") return `${i.by || "歌い手不明"}${i.p ? `（原曲：${i.p}）` : ""}`;
  return [i.p, i.v && `feat. ${i.v}`].filter(Boolean).join(" ") || "作者不明";
}

const who = (label, title, person) => el("button",{class:"who", title, onclick:e=>{ e.stopPropagation(); applyFilter(()=>state.person=person); }}, label);
function creditEls(i){
  const artist = i.p ? who(i.p, `${i.p}の曲を表示`, {label:`作者：${i.p}`, match:x=>x.a===i.a, a:i.a, key:"a:"+i.a}) : null;
  const voice = i.v ? who(i.v, `${i.v}が歌う曲を表示`, {label:`歌声：${i.v}`, match:x=>x.v===i.v, key:"v:"+i.v}) : null;
  if (i.kind === "歌ってみた"){
    const singer = i.by ? who(i.by, `${i.by}の歌ってみたを表示`, {label:`歌い手：${i.by}`, match:x=>x.by===i.by, key:"b:"+i.by}) : el("span",{class:"unknown"},"歌い手不明");
    return [el("span",{}, singer, artist ? "（原曲：" : null, artist, artist ? "）" : null)];
  }
  if (!artist && !voice) return [el("span",{class:"unknown"},"作者不明")];
  return [el("span",{}, artist, artist && voice ? " feat. " : voice ? "歌声：" : null, voice)];
}

function seg(container, key, options){
  container.replaceChildren(...options.map(([val,label])=>
    el("button",{"aria-pressed":String(state[key]===val), onclick:()=>applyFilter(()=>state[key]=val)}, label)));
}

function related(i){
  const groups = [];
  const notSelf = arr => arr.filter(x=>x.id!==i.id);
  const cap = (arr, n=8) => arr.sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,n);
  if (i.kind === "本家"){
    const covers = ITEMS.filter(x=>x.kind==="歌ってみた" && x.of===i.id);
    const selfs = covers.filter(x=>x.self);
    if (selfs.length) groups.push(["作者本人のセルフカバー", cap(selfs), x=>x.by || ""]);
    groups.push(["この曲の歌ってみた", cap(covers.filter(x=>!x.self)), x=>x.by || "歌い手不明"]);
  } else {
    const o = original(i);
    groups.push(["原曲", o ? [o] : [], x=>creditText(x)]);
    if (o) groups.push(["ほかの人の歌ってみた", cap(notSelf(ITEMS.filter(x=>x.kind==="歌ってみた" && x.of===o.id))), x=>x.by || "歌い手不明"]);
    if (i.by) groups.push([`${i.by} のほかの歌ってみた`, cap(notSelf(ITEMS.filter(x=>x.kind==="歌ってみた" && x.by===i.by))), x=>x.t]);
  }
  const src = i.kind === "本家" ? i : original(i);
  if (src && realKey(src.a)){
    const same = cap(ITEMS.filter(x=>x.kind==="本家" && x.a===src.a && x.id!==src.id));
    groups.push([src.p ? "同じ作者の曲" : "同じ投稿者の曲", same, x=>creditText(x)]);
  }
  const sp = songPage(i.kind === "本家" ? i : original(i));
  const cp = src && realKey(src.a) ? creatorPage(src.a) : null;
  return el("div",{class:"related", onclick:e=>e.stopPropagation()},
    sp ? el("a",{class:"pagelink", href:sp}, i.kind === "本家" ? "この曲のページ →" : "原曲のページ →") : null,
    ...groups.map(([h, list, sub])=>el("div",{class:"rgroup"},
      el("h3",{},h, /同じ作者/.test(h) && cp ? el("a",{class:"pagelink", href:cp}, "作者ページ →") : null),
      ...(list.length ? list.map(x=>el("div",{class:"ritem"},
        el("button",{onclick:()=>jump(x.id)}, x.t),
        el("span",{class:"badge kind"+(x.kind==="歌ってみた"?" cover":"")}, x.kind),
        x.self ? el("span",{class:"badge self"}, "セルフカバー") : null,
        el("span",{class:"sub"}, sub(x)))) : [el("span",{class:"none"},"まだ見つかってないよ")]))));
}

// 上に固定された検索欄に隠れないように、その下に曲の行が来るようにスクロールする
function scrollToItem(node, smooth){
  const top = node.getBoundingClientRect().top + window.scrollY - $(".bar").offsetHeight - 8;
  window.scrollTo({ top, behavior: smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth" : "auto" });
}

function jump(id){
  state.q=""; $("#q").value=""; state.period=""; $("#period").value=""; state.genre=""; state.kind=""; state.person=null; state.filter.clear();
  state.rel = id; state.open = null;
  // 一覧のどこにあっても表示されるように、表示件数を広げる
  const idx = visibleItems().findIndex(x=>x.id===id);
  if (idx >= state.shown) state.shown = idx + 1;
  render();
  const node = document.getElementById("item-"+id);
  if (node){ scrollToItem(node, true); node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
}

// ---------- 絞り込み欄をしまう ----------
// 検索欄だけ残して、期間・並び順・ジャンル・タグをしまえる。しまっている間は、今の絞り込みを1行で見せる。
// スマホでプレイヤーを開いたときは、曲のリストを広く見られるように自動でしまう
const FOLD_KEY = "tagtune:fold";
const narrow = matchMedia("(max-width:520px)");
function setFold(folded, remember){
  $(".bar").classList.toggle("folded", folded);
  $("#fold").setAttribute("aria-expanded", String(!folded));
  $("#fold .arrow").textContent = folded ? "▾" : "▴";
  if (remember) { try { localStorage.setItem(FOLD_KEY, folded ? "1" : "0"); } catch {} }
  updateFoldInfo();
}
function updateFoldInfo(){
  const folded = $(".bar").classList.contains("folded");
  const opt = id => $(id).selectedOptions[0]?.textContent || "";
  const active = [state.genre, state.kind, state.person?.label, state.period && opt("#period"), ...state.filter].filter(Boolean);
  const btn = $("#fold");
  btn.querySelector(".n")?.remove();
  if (active.length) btn.insertBefore(el("span",{class:"n", "aria-label":`${active.length}件の絞り込み中`}, String(active.length)), btn.querySelector(".arrow"));
  $("#summary").hidden = !folded;
  $("#summary").textContent = [active.length ? active.join("・") : "すべての曲", opt("#sort")].join("　｜　");
}
$("#fold").addEventListener("click", ()=>setFold(!$(".bar").classList.contains("folded"), true));

function applyFilter(fn){
  fn(); state.rel = null; state.open = null; state.shown = PAGE;
  render();
  const list = $("#list"), bar = $(".bar");
  const top = list.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 8;
  if (window.scrollY > top) window.scrollTo({top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

let lastCounts = {};
function visibleItems(){
  const c = lastCounts;
  const q = state.q.trim().toLowerCase();
  const since = state.period ? new Date(Date.now() - Number(state.period) * 864e5).toISOString() : "";
  const items = ITEMS.filter(i=>{
    if (since && (!i.date || new Date(i.date).toISOString() < since)) return false;
    if (state.genre && i.g !== state.genre) return false;
    if (state.kind && i.kind !== state.kind) return false;
    if (state.person && !state.person.match(i)) return false;
    if (q && ![i.t,i.title,i.p,i.v,i.by].some(x=>x && x.toLowerCase().includes(q))) return false;
    for (const t of state.filter) if (!(c[i.id]?.[t] > 0)) return false;
    return true;
  });
  const total = i => Object.values(c[i.id]||{}).reduce((a,b)=>a+b,0);
  // 投稿日時はニコニコが日本時間（+09:00）、YouTubeが世界標準時（Z）で書かれているので、文字のままではなく時刻に直して比べる
  const byDate = (a,b)=>(b._t||0)-(a._t||0);
  items.sort(state.sort==="votes" ? (a,b)=>total(b)-total(a) || (b.views||0)-(a.views||0)
    : state.sort==="new" ? byDate : (a,b)=>(b.views||0)-(a.views||0));
  return items;
}

function render(){
  const y = window.scrollY;
  lastCounts = counts();
  const genres = [...new Set(ITEMS.map(i=>i.g))];
  seg($("#genreSeg"), "genre", [["","すべて"], ...["ボカロ","J-POP","アニソン","その他"].filter(g=>genres.includes(g)).map(g=>[g,g])]);
  seg($("#kindSeg"), "kind", [["","すべて"],["本家","本家"],["歌ってみた","歌ってみた"]]);
  const personPage = state.person?.a ? creatorPage(state.person.a) : null;
  $("#personBox").replaceChildren(...(state.person ? [el("span",{class:"active"}, state.person.label,
    el("button",{"aria-label":"絞り込みを解除", onclick:()=>applyFilter(()=>state.person=null)}, "×")),
    personPage ? el("a",{class:"pagelink", href:personPage}, "作者ページ →") : null] : []));
  $("#tagFilter").replaceChildren(...TAGS.map(t=>
    el("button",{class:"chip","aria-pressed":String(state.filter.has(t)), onclick:()=>applyFilter(()=>{ state.filter.has(t)?state.filter.delete(t):state.filter.add(t); })}, t)));

  const items = visibleItems();
  $("#count").textContent = ITEMS.length ? `${items.length.toLocaleString("ja-JP")}曲` : "";
  syncUrl();
  updateFoldInfo();
  const list = $("#list");
  list.style.minHeight = list.offsetHeight + "px";
  list.replaceChildren();
  if (ITEMS.length && !items.length) list.append(el("div",{class:"empty"},"条件に合う曲がまだないよ。絞り込みをゆるめるか、タグをつけてみよう！"));
  items.slice(0, state.shown).forEach((i,n)=>list.append(buildItem(i, n, lastCounts)));
  list.style.minHeight = "";
  $("#more").hidden = items.length <= state.shown;
  $("#more").textContent = `もっと見る（残り${(items.length - state.shown).toLocaleString("ja-JP")}曲）`;
  window.scrollTo(0, y);
}

function refresh(...ids){
  const c = lastCounts = counts();
  const active = document.activeElement?.dataset?.k;
  for (const id of new Set(ids.filter(Boolean))){
    const node = document.getElementById("item-"+id);
    if (!node) continue;
    node.replaceWith(buildItem(ITEM[id], Number(node.dataset.n), c));
  }
  if (active) document.querySelector(`[data-k="${CSS.escape(active)}"]`)?.focus({preventScroll:true});
}

// ---------- ページ内再生 ----------
// サムネの▶を押した曲だけ、YouTube／ニコニコ公式の埋め込みプレイヤーを画面下に出す（同時に1曲だけ）。
// プレイヤーは押したときに初めて読み込むので、ページを開いたときの重さは変わらない。
// 埋め込みが禁止されている動画（ne）は▶を出さず、今まで通りリンクで動画サイトへ飛ぶ
// YouTube とニコニコの両方にある曲は、1行にまとめて alt（もう片方の投稿）を持っている
const sources = i => [i, ...(i.alt || [])];
const srcLabel = src => src === "youtube" ? "YouTube" : "ニコニコ";
function embedOf(v){
  const vid = v.id.slice(v.id.indexOf(":") + 1);
  // enablejsapi / jsapi：曲が終わったことを知らせてもらう（おまかせ再生で次の曲へ進むため）
  if (v.src === "youtube" && !v.ne) return `https://www.youtube.com/embed/${encodeURIComponent(vid)}?autoplay=1&playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  if (v.src === "niconico" && /^(sm|so|nm)\d+$/.test(vid)) return `https://embed.nicovideo.jp/watch/${vid}?autoplay=1&jsapi=1&playerId=tagtune`;
  return null;
}
// ページ内で再生する投稿（両方あるときは YouTube を優先）
const playSource = i => [...sources(i)].sort((a,b)=>(a.src==="youtube"?0:1)-(b.src==="youtube"?0:1)).find(embedOf) || null;
const embedUrl = i => { const v = playSource(i); return v ? embedOf(v) : null; };
const thumbOf = i => (sources(i).find(v=>v.src==="youtube" && v.thumb) || i).thumb;
function thumbEl(i){
  const img = thumbOf(i) ? el("img",{src:thumbOf(i), alt:"", loading:"lazy", decoding:"async", referrerpolicy:"no-referrer", onerror:e=>{ e.target.remove(); }}) : null;
  if (!embedUrl(i)) return el("a",{class:"thumb", href:i.url, target:"_blank", rel:"noopener", tabindex:"-1", "aria-hidden":"true", onclick:e=>e.stopPropagation()}, img);
  const playing = state.play === i.id;
  return el("button",{class:"thumb"+(playing?" playing":""), "data-k":`${i.id}|play`, "aria-label": playing ? `「${i.t}」を再生中（押すと閉じる）` : `「${i.t}」をこのページで再生`,
    onclick:e=>{ e.stopPropagation(); playing ? closePlayer() : play(i.id); }},
    img, el("span",{class:"play","aria-hidden":"true"}, playing ? "再生中" : "▶"));
}
function play(id, opts={}){
  const i = ITEM[id], url = embedUrl(i), ps = playSource(i);
  if (!url) return;
  if (!opts.shuffle) state.shuffle = null;   // 曲を自分で選んだら、おまかせ再生はおしまい
  const prev = state.play;
  state.play = id;
  const sh = state.shuffle;
  const frame = el("iframe",{src:url, title:`${i.t}（${ps.src==="youtube"?"YouTube":"ニコニコ動画"}のプレイヤー）`,
      allow:"autoplay; encrypted-media; picture-in-picture; fullscreen", allowfullscreen:"", referrerpolicy:"strict-origin-when-cross-origin"});
  // YouTube に「再生状態を教えて」と頼む（曲の終わりを知るため）
  frame.addEventListener("load", ()=>{
    if (ps.src !== "youtube") return;
    for (const m of [{event:"listening", id:1, channel:"widget"}, {event:"command", func:"addEventListener", args:["onStateChange"], id:1, channel:"widget"}])
      frame.contentWindow?.postMessage(JSON.stringify(m), "https://www.youtube.com");
  });
  $("#player").replaceChildren(
    el("div",{class:"ph"},
      sh ? el("span",{class:"mode", title: sh.label}, "🎲") : null,
      el("a",{href:ps.url, target:"_blank", rel:"noopener", title:`${ps.src==="youtube"?"YouTube":"ニコニコ動画"}で開く`}, i.t, " ↗"),
      detailUrl(i) ? el("a",{class:"pg", href:detailUrl(i), onclick:saveView, title:"曲のページ"}, "ページ") : null,
      sh ? el("button",{class:"next", "aria-label":"次の曲へ", title:"次の曲へ", onclick:()=>nextShuffle()}, "⏭") : null,
      el("button",{"aria-label":"プレイヤーを閉じる", onclick:closePlayer}, "×")),
    sh ? el("p",{class:"from"}, `おまかせ再生中：${sh.label}（${sh.count.toLocaleString("ja-JP")}曲から）`) : null,
    frame);
  $("#player").hidden = false;
  document.body.classList.add("has-player");
  if (narrow.matches && !$(".bar").classList.contains("folded")) setFold(true, false);
  refresh(prev, id);
}
function closePlayer(){
  const prev = state.play;
  state.play = null;
  state.shuffle = null;
  $("#player").replaceChildren();   // iframeを消すと再生も止まる
  $("#player").hidden = true;
  document.body.classList.remove("has-player");
  refresh(prev);
}
document.addEventListener("keydown", e=>{ if (e.key === "Escape" && state.play && !e.target.closest?.("input,select")) closePlayer(); });

// ---------- おまかせ再生（🎲） ----------
// 今の絞り込みの中から、ページ内で再生できる曲をランダムに選んで流す。再生数に関係なく同じ確率で選ぶ（埋もれた曲にも出会えるように）。
// 1曲終わると次の曲へ。一度流れた曲は、その絞り込みの曲を一通り流すまで出さない
const played = new Set();
let lastNext = 0;
function shuffleLabel(){
  const opt = id => $(id).selectedOptions[0]?.textContent || "";
  const parts = [state.genre, state.kind, state.person?.label, state.period && opt("#period"), ...state.filter, state.q && `「${state.q}」`].filter(Boolean);
  return parts.length ? parts.join("・") : "すべての曲";
}
function nextShuffle(){
  const now = Date.now();
  if (now - lastNext < 800) return;   // 終わりの合図が続けて来たときに2曲飛ばさないように
  lastNext = now;
  const pool = visibleItems().filter(i=>embedUrl(i));
  if (!pool.length) { setStatus("今の絞り込みには、このページで再生できる曲がないよ。絞り込みを変えてみてね。"); closePlayer(); return; }
  let fresh = pool.filter(i=>!played.has(i.id) && i.id !== state.play);
  if (!fresh.length) { played.clear(); fresh = pool.filter(i=>i.id !== state.play); if (!fresh.length) fresh = pool; }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  played.add(pick.id);
  state.shuffle = { label: shuffleLabel(), count: pool.length };
  play(pick.id, { shuffle:true });
  const node = document.getElementById("item-"+pick.id);
  if (node){ node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
}
$("#shuffle").addEventListener("click", ()=>{ lastNext = 0; nextShuffle(); });
// 曲が終わったら次の曲へ（YouTube：状態 0 が「終了」、ニコニコ：playerStatus 4 が「終了」）
window.addEventListener("message", e=>{
  if (!state.play) return;
  // 今流れているプレイヤーからの合図だけを見る（閉じた前のプレイヤーの合図は無視）
  if (e.source !== $("#player iframe")?.contentWindow) return;
  let d = e.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch { return; } }
  if (!d || typeof d !== "object") return;
  let host = "";
  try { host = new URL(e.origin).hostname; } catch { return; }
  // ニコニコは準備ができたら（loadComplete）こちらから「再生」を送る（autoplay だけでは始まらないことがあるため）
  if (/(^|\.)nicovideo\.jp$/.test(host) && d.eventName === "loadComplete") {
    e.source.postMessage({ sourceConnectorType: 1, playerId: "tagtune", eventName: "play" }, e.origin);
    return;
  }
  const ended = /(^|\.)youtube\.com$/.test(host)
    ? (d.event === "onStateChange" && d.info === 0) || (d.event === "infoDelivery" && d.info?.playerState === 0)
    : /(^|\.)nicovideo\.jp$/.test(host) && d.eventName === "playerStatusChange" && d.data?.playerStatus === 4;
  if (ended && state.shuffle) nextShuffle();
});

function buildItem(i, n, c){
  const sc = c[i.id] || {};
  const mine = new Set(state.mine[i.id] || []);
  const tagEls = Object.entries(sc).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([t,v])=>
    el("button",{class:"tag"+(v>=FIXED_AT?" fixed":"")+(mine.has(t)?" mine":""), "data-k":`${i.id}|tag|${t}`, title: mine.has(t)?"タップで取り消し":"タップで自分も投票", onclick:e=>{ e.stopPropagation(); toggle(i.id,t); }}, t, el("span",{class:"n"},String(v))));
  const isOpen = state.open === i.id, isRel = state.rel === i.id;
  const tags = el("div",{class:"tags"}, ...tagEls,
    state.canWrite ? el("button",{class:"add","data-k":`${i.id}|add`,"aria-expanded":String(isOpen), onclick:e=>{ e.stopPropagation(); const prev = state.open; state.open = isOpen?null:i.id; refresh(prev, i.id); }}, isOpen?"閉じる":"＋ タグをつける") : null);
  const picker = isOpen ? el("div",{class:"picker", onclick:e=>e.stopPropagation()},
    el("p",{},"この動画の印象は？（いくつでも選べる・もう一度押すと取り消し）"),
    el("div",{class:"chips"}, ...TAGS.map(t=>el("button",{class:"chip","data-k":`${i.id}|pick|${t}`,"aria-pressed":String(mine.has(t)), onclick:()=>toggle(i.id,t)}, t)))) : null;
  const toggleRel = ()=>{ const prev = state.rel; state.rel = isRel ? null : i.id; refresh(prev, i.id); };
  return el("article",{class:"song", id:"item-"+i.id, "data-n":String(n), onclick:toggleRel},
    el("div",{class:"no"}, String(n+1).padStart(2,"0")),
    thumbEl(i),
    el("div",{class:"body"},
      el("div",{class:"head"},
        el("h2",{class:"title"}, ...(detailUrl(i)
          ? [el("a",{href:detailUrl(i), title:`${i.title}（曲のページを開く）`, onclick:e=>{ e.stopPropagation(); saveView(); }}, i.t),
             el("a",{class:"ext", href:i.url, target:"_blank", rel:"noopener", title:`${i.src==="youtube"?"YouTube":"ニコニコ動画"}で開く`, "aria-label":`${i.src==="youtube"?"YouTube":"ニコニコ動画"}で開く`, onclick:e=>e.stopPropagation()}, "↗")]
          : [el("a",{href:i.url,target:"_blank",rel:"noopener", title:i.title, onclick:e=>e.stopPropagation()}, i.t, el("span",{class:"ext"},"↗"))])),
        el("button",{class:"more","data-k":`${i.id}|rel`,"aria-expanded":String(isRel), onclick:e=>{ e.stopPropagation(); toggleRel(); }}, isRel?"関連を閉じる":"関連 ▾")),
      el("div",{class:"meta"},
        el("button",{class:"badge genre", title:`${i.g}だけ表示`, onclick:e=>{ e.stopPropagation(); applyFilter(()=>state.genre=i.g); }}, i.g),
        el("button",{class:"badge kind"+(i.kind==="歌ってみた"?" cover":""), title:`${i.kind}だけ表示`, onclick:e=>{ e.stopPropagation(); applyFilter(()=>state.kind=i.kind); }}, i.kind),
        i.self ? el("span",{class:"badge self", title:"作曲した本人が歌っている歌ってみた"}, "セルフカバー") : null,
        ...creditEls(i),
        ...sources(i).map(v=>el("a",{class:"badge src", href:v.url, target:"_blank", rel:"noopener", title:`${srcLabel(v.src)}で開く${i.alt ? `（${fmtViews(v.views)}）` : ""}`, onclick:e=>e.stopPropagation()}, srcLabel(v.src))),
        el("span",{title: i.alt ? sources(i).map(v=>`${srcLabel(v.src)} ${fmtViews(v.views)}`).join("・") : null}, (i.alt ? "合計 " : "") + fmtViews(i.views)),
        el("span",{}, fmtDate(i.date))),
      tags, picker, isRel ? related(i) : null));
}

// ---------- タグ投票の保存 ----------
// Supabase の設定があれば、みんなの票として保存・集計する。なければこのブラウザにだけ保存する
const LS_KEY = "vocalo-tagcho:votes";
const sb = SUPABASE_URL && SUPABASE_KEY && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let queue = Promise.resolve();

function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state.mine)); } catch {} }
function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch { return {}; } }

// 匿名でログイン（初めて投票したときだけ）。同じブラウザなら次からも同じ人として扱われる
async function ensureSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) return data.session;
  const r = await sb.auth.signInAnonymously();
  if (r.error) throw r.error;
  return r.data.session;
}

// みんなの票数を読み込む（1,000件ずつ）
async function loadCounts(){
  const all = {};
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.rpc("get_tag_counts").range(from, from + 999);
    if (error) throw error;
    for (const r of data) { const id = ALIAS[r.song_id] || r.song_id; all[id] ??= {}; all[id][r.tag] = (all[id][r.tag] || 0) + Number(r.n); }
    if (data.length < 1000) break;
  }
  state.serverCounts = all;
}

// 自分の票を読み込む
async function loadMine(){
  const mine = {};
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("votes").select("song_id,tag").range(from, from + 999);
    if (error) throw error;
    for (const r of data) { const id = ALIAS[r.song_id] || r.song_id; mine[id] ??= []; if (!mine[id].includes(r.tag)) mine[id].push(r.tag); }
    if (data.length < 1000) break;
  }
  state.serverMine = structuredClone(mine);
  state.mine = mine;
}

function toggle(sid, t){
  if (!state.canWrite) return;
  const cur = new Set(state.mine[sid] || []);
  const adding = !cur.has(t);
  adding ? cur.add(t) : cur.delete(t);
  if (cur.size) state.mine[sid] = [...cur]; else delete state.mine[sid];
  refresh(sid);
  if (!sb) { saveLocal(); return; }
  queue = queue.then(async ()=>{
    await ensureSession();
    const r = adding
      ? await sb.from("votes").upsert({ song_id: sid, tag: t }, { onConflict: "user_id,song_id,tag", ignoreDuplicates: true })
      : await sb.from("votes").delete().in("song_id", [sid, ...(ITEM[sid]?.alt || []).map(v=>v.id)]).eq("tag", t);
    if (r.error) throw r.error;
  }).catch(e=>{
    console.warn(e);
    // 保存できなかったら画面を元に戻す
    const back = new Set(state.mine[sid] || []);
    adding ? back.delete(t) : back.add(t);
    if (back.size) state.mine[sid] = [...back]; else delete state.mine[sid];
    refresh(sid);
    setStatus(/上限/.test(e?.message || "") ? "投票できる数の上限に達したよ。" : "投票を保存できなかったよ。少し待ってからもう一度押してみて。");
  });
}

async function startVotes(){
  if (!sb) { state.mine = loadLocal(); render(); return; }
  try {
    await loadCounts();
    const { data } = await sb.auth.getSession();
    if (data.session) await loadMine();
    // 以前このブラウザだけに保存していた票があれば、みんなの票に移す
    const local = loadLocal();
    const rows = Object.entries(local).flatMap(([song_id, tags]) => tags.filter(t => TAGS.includes(t)).map(tag => ({ song_id, tag })));
    if (rows.length) {
      await ensureSession();
      const r = await sb.from("votes").upsert(rows, { onConflict: "user_id,song_id,tag", ignoreDuplicates: true });
      if (!r.error) { try { localStorage.removeItem(LS_KEY); } catch {} await loadCounts(); await loadMine(); }
    }
  } catch (e) {
    console.warn(e);
    setStatus(baseNote + " みんなのタグを読み込めなかったよ。少し待ってから開き直してみて。");
  }
  render();
}

// 別のタブから戻ってきたときなどに、みんなの票数を新しくする（1分に1回まで）
let lastCountsAt = Date.now();
document.addEventListener("visibilitychange", async ()=>{
  if (!sb || document.visibilityState !== "visible" || Date.now() - lastCountsAt < 60e3) return;
  lastCountsAt = Date.now();
  try { await loadCounts(); refresh(...[...document.querySelectorAll("#list .song")].map(n=>n.id.slice(5))); } catch {}
});

let baseNote = "";
function setStatus(html){ $("#status").innerHTML = html; }

$("#q").addEventListener("input", e=>{ state.q = e.target.value; state.shown = PAGE; render(); });
$("#sort").addEventListener("change", e=>{ state.sort = e.target.value; state.shown = PAGE; render(); });
$("#period").addEventListener("change", e=>{ state.period = e.target.value; state.shown = PAGE; render(); });
$("#more").addEventListener("click", ()=>{ state.shown += PAGE; render(); });

// ---------- URL と表示状態 ----------
// 絞り込みをURLに入れておく（曲ページから「戻る」で帰ってきたときや、URLを人に送ったときに同じ絞り込みになる）
// 曲ページ・タグページからのリンク（?id=曲 / ?tag=タグ / ?q=検索語）にも対応
let pendingId = null;
function personFromKey(key){
  const kind = key.slice(0, 2), v = key.slice(2);
  if (kind === "a:") { const x = ITEMS.find(i=>i.a===v && i.p); return x ? {label:`作者：${x.p}`, match:i=>i.a===v, a:v, key} : null; }
  if (kind === "v:") return {label:`歌声：${v}`, match:i=>i.v===v, key};
  if (kind === "b:") return {label:`歌い手：${v}`, match:i=>i.by===v, key};
  return null;
}
function applyUrlParams(){
  const P = new URLSearchParams(location.search);
  const q = P.get("q"), id = P.get("id");
  if (q) { state.q = q; $("#q").value = q; }
  for (const t of (P.get("tag") || "").split(",")) if (TAGS.includes(t)) state.filter.add(t);
  if (["ボカロ","J-POP","アニソン","その他"].includes(P.get("g"))) state.genre = P.get("g");
  if (["本家","歌ってみた"].includes(P.get("k"))) state.kind = P.get("k");
  if (["1","7","30","182","365"].includes(P.get("period"))) { state.period = P.get("period"); $("#period").value = state.period; }
  if (["new","votes"].includes(P.get("sort"))) { state.sort = P.get("sort"); $("#sort").value = state.sort; }
  if (P.get("who")) state.person = personFromKey(P.get("who"));
  if (id) pendingId = id;
}
function syncUrl(){
  if (!ITEMS.length) return;
  const P = new URLSearchParams();
  if (state.q) P.set("q", state.q);
  if (state.genre) P.set("g", state.genre);
  if (state.kind) P.set("k", state.kind);
  if (state.period) P.set("period", state.period);
  if (state.sort !== "views") P.set("sort", state.sort);
  if (state.filter.size) P.set("tag", [...state.filter].join(","));
  if (state.person?.key) P.set("who", state.person.key);
  const qs = P.toString();
  const next = qs ? "?" + qs : location.pathname;
  if (location.search !== (qs ? "?" + qs : "")) history.replaceState(null, "", next);
}
// 曲ページへ移る前に、スクロール位置・表示件数・開いていた関連を覚えておく（戻ってきたら元の場所に）
const VIEW_KEY = "tagtune:view";
function saveView(){
  try { sessionStorage.setItem(VIEW_KEY, JSON.stringify({ search: location.search, y: Math.round(window.scrollY), shown: state.shown, rel: state.rel })); } catch {}
}
function loadView(){
  try { const v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null"); return v && v.search === location.search ? v : null; } catch { return null; }
}
window.addEventListener("pagehide", saveView);
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
try { if (localStorage.getItem(FOLD_KEY) === "1") $(".bar").classList.add("folded"); } catch {}
setFold($(".bar").classList.contains("folded"), false);
render();

(async()=>{
  try {
    const [songs, meta, pages] = await Promise.all([fetch("data/site.json").then(r=>r.json()), fetch("data/meta.json").then(r=>r.json()).catch(()=>null), fetch("data/pages.json").then(r=>r.json()).catch(()=>null)]);
    CREATOR_PAGE = pages?.creators || {};
    for (const i of songs) i._t = Date.parse(i.date) || 0;
    ITEMS = songs; ITEM = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
    // まとめた曲のもう片方のID → 代表のID（前に別々に入った票やリンクも同じ曲として扱う）
    for (const i of ITEMS) for (const v of i.alt || []) { ALIAS[v.id] = i.id; ITEM[v.id] = i; }
    baseNote = `${ITEMS.length.toLocaleString("ja-JP")}曲を収録${meta ? `（${fmtDate(meta.updatedAt)}時点）` : ""}。🎲で今の絞り込みからおまかせ再生、サムネの▶でこのページで再生、曲名で曲のページ、↗で動画サイトを開く、名前やバッジで絞り込み、行を押すと関連曲。作者名が空の曲は、読み取りを改善中。${sb ? "「＋ タグをつける」から、聴いた印象を投票してね。みんなの票で3票以上集まったタグが定着するよ。" : "タグの投票は今はこの端末にだけ保存されるよ（みんなの集計は準備中）。"}`;
    setStatus(baseNote);
    applyUrlParams();
    if (pendingId && ALIAS[pendingId]) pendingId = ALIAS[pendingId];
    const view = pendingId ? null : loadView();
    if (view) { state.shown = Math.max(PAGE, view.shown || PAGE); state.rel = view.rel && ITEM[view.rel] ? view.rel : null; }
    render();
    if (view) window.scrollTo(0, view.y || 0);
    if (pendingId && ITEM[pendingId]) jump(pendingId);
    // 票を読み込んだあとに一覧を描き直すので、リンクで開いた曲・戻ってきたときの位置にもう一度合わせる
    const y0 = window.scrollY;
    startVotes().finally(()=>{
      if (pendingId && window.scrollY < 50) { const n = document.getElementById("item-"+pendingId); if (n) scrollToItem(n, false); }
      else if (view && Math.abs(window.scrollY - y0) < 5) window.scrollTo(0, view.y || 0);
    });
  } catch {
    setStatus("曲データを読み込めなかったよ。ページを開き直してみて。");
  }
})();

</script>
